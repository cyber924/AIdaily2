name = "aidaily2"
main = "src/index.ts"
compatibility_date = "2026-11-27"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "aidaily2-db"
database_id = "23a759cf-81f2-46b5-a8a7-f62e3f76dfb7"
migrations_dir = "migrations"

[vars]
APP_TIMEZONE = "Asia/Seoul"
GEMINI_MODEL = "gemini-3.8-flash"
UNSPLASH_SOURCE = "unsplash"
